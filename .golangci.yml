version: "2"
run:
  timeout: 5m
linters:
  enable:
    - goheader
    - revive
    - unused
  settings:
    goheader:
      values:
        regexp:
          copyright-year: 20[0-9][0-9]
      template-path: code-header-template.txt
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new-from-rev: ae7b7b79a75756ae3cec92e8bb8c6bf0c4dab48e
