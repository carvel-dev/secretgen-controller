name: Kind Cluster E2E tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
    - 'docs/**'
  push:
    branches:
      - develop
    paths-ignore:
    - 'docs/**'
    - '*.md'
  workflow_dispatch:

jobs:
  run-tests:
    name: e2e tests on kind
    runs-on: ubuntu-latest
    env:
      KIND_CLUSTER_NAME: kinder
      K8S_VERSION: v1.34.0
    steps:
      - name: Install kind
        run: |
          KIND_VERSION="v0.30.0"
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind --version
      - name: Create Kind Cluster
        run: |
          kind create cluster --name $KIND_CLUSTER_NAME --image kindest/node:${K8S_VERSION}
      - name: Verify kind and k8s version
        run: |
          kind version
          kubectl version
          kubectl cluster-info --context kind-kinder
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Carvel Tools
        uses: carvel-dev/setup-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          only: ytt, kapp, kbld
          ytt: v0.52.0
          kapp: v0.64.2
          kbld: v0.46.0
      # Run benchmark with `go test -bench` and stores the output to a file
      - name: Install sg and run e2e tests on kind
        run: |
          set -e -x
          kubectl version

          ytt -f config/package-bundle/config -f config/dev | kbld -f- > kbld.out 2> kbldmeta.out
          cat kbldmeta.out | tail -n 1 | sed 's/.*final: secretgen-controller -> \(.*\)$/\1/p'  | tail -n 1 | xargs kind load docker-image --name kinder
          kapp deploy -a sg -f kbld.out -c -y

          mkdir tmp
          SECRETGEN_E2E_NAMESPACE=secretgen-test eval './hack/test-e2e.sh'
