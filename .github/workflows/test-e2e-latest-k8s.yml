name: Run E2E Kind Tests

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  test-k8s-1-34-1:
    runs-on: ubuntu-latest
    env:
      KIND_CLUSTER_NAME: kinder
      K8S_VERSION: v1.34.1
    steps:
    - name: install kind
      run: |
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-$(uname)-amd64
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/kind
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: Verify go version
      run: |
        go version
    - name: Install bazelisk
      run: |
        curl -Lo bazelisk https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
        chmod +x bazelisk
        sudo mv bazelisk /usr/local/bin/bazel

    - name: Clone Kubernetes source at ${{ env.K8S_VERSION }}
      run: |
        git clone --depth 1 --branch ${K8S_VERSION} https://github.com/kubernetes/kubernetes.git
        ls kubernetes

    - name: Debug working directories
      run: |
        echo "Workflow root: $PWD"
        echo "Listing contents:"
        ls -la
        echo "Listing kubernetes source:"
        ls -la kubernetes

    - name: Build KIND node image for Kubernetes ${{ env.K8S_VERSION }}
      working-directory: ./kubernetes
      run: |
        kind build node-image --type=bazel --image kindest/node:${K8S_VERSION}

    - name: Create KIND cluster with custom image
      run: |
        kind create cluster --name $KIND_CLUSTER_NAME --image kindest/node:${K8S_VERSION}

    - name: Verify cluster is ready
      run: kubectl cluster-info --context kind-${KIND_CLUSTER_NAME}
    - name: Install Carvel Tools
      uses: carvel-dev/setup-action@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        only: ytt, kapp, kbld
        ytt: v0.52.0
        kapp: v0.64.2
        kbld: v0.46.0
    - name: Install sg and run e2e tests on kind
      run: |
        set -e -x
        kubectl version

        ytt -f config/package-bundle/config -f config/dev | kbld -f- > kbld.out 2> kbldmeta.out
        cat kbldmeta.out | tail -n 1 | sed 's/.*final: secretgen-controller -> \(.*\)$/\1/p'  | tail -n 1 | xargs kind load docker-image --name kinder
        kapp deploy -a sg -f kbld.out -c -y

        mkdir tmp
        SECRETGEN_E2E_NAMESPACE=secretgen-test eval './hack/test-e2e.sh'