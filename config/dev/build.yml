#@ load("@ytt:data", "data")

---
apiVersion: kbld.k14s.io/v1alpha1
kind: Sources
sources:
- image: secretgen-controller
  path: .
  docker:
    #@ if data.values.dev.rapid_deploy:
    build:
      pull: false
      noCache: false
      file: Dockerfile.dev
      buildkit: true
    #@ elif data.values.dev.push_images:
    #! Multi-arch/push builds need Buildx; only exercised when actually pushing.
    buildx:
      #! Always rebuild image
      pull: true
      noCache: true
      rawOptions:
      - #@ "--build-arg=SGCTRL_VER="+data.values.dev.version
      #@ if/end data.values.dev.platform != "":
      - #@ "--platform="+data.values.dev.platform
    #@ else:
    #! Classic `docker build` avoids bootstrapping a Buildx builder, which
    #! fails to inspect its builder image under minikube's docker-env when
    #! the node's container runtime is containerd.
    build: {}
    #@ end

#@ if/end data.values.dev.push_images:
---
apiVersion: kbld.k14s.io/v1alpha1
kind: ImageDestinations
destinations:
- image: secretgen-controller
  newImage: #@ data.values.dev.image_repo
